[package]
name = "m2m"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
bcs = "0.1.6"
blake2 = "0.10.6"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2"
fs2 = "0.4.3"
hex = "0.4"
iroh = "=1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sui-sdk-types = { version = "=0.4.0", features = ["serde"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1
