# TEMPLATE ONLY. Render explicit new app names from the deployment manifest.
app = "CHOOSE_NEW_COORDINATOR_APP"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "deploy/agent-demo/Dockerfile"
  ignorefile = "deploy/agent-demo/.dockerignore"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[env]
  NODE_ENV = "production"
  M2M_NATIVE_BRIDGE = "/usr/local/bin/native-bridge"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [http_service.concurrency]
    type = "requests"
    soft_limit = 16
    hard_limit = 32

  [http_service.http_options]
    idle_timeout = 120

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "m2m_state"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
